<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pallet · B2B Signup Flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: "Inter", system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
  const SCREEN_W = 980;
  const SCREEN_H = 660;

  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="flow"
          title="Pallet · B2B Signup Flow"
          subtitle="Wholesale onboarding — 6 screens, blue primary + orange accent. Inter."
        >
          <DCArtboard id="s1" label="01 · Create account" width={SCREEN_W} height={SCREEN_H}>
            <Screen1_Account />
          </DCArtboard>
          <DCArtboard id="s2" label="02 · Business details" width={SCREEN_W} height={SCREEN_H}>
            <Screen2_Business />
          </DCArtboard>
          <DCArtboard id="s3" label="03 · Verify business" width={SCREEN_W} height={SCREEN_H}>
            <Screen3_Verify />
          </DCArtboard>
          <DCArtboard id="s4" label="04 · Invite team" width={SCREEN_W} height={SCREEN_H}>
            <Screen4_Team />
          </DCArtboard>
          <DCArtboard id="s5" label="05 · Under review" width={SCREEN_W} height={SCREEN_H}>
            <Screen5_Pending />
          </DCArtboard>
          <DCArtboard id="s6" label="06 · Welcome" width={SCREEN_W} height={SCREEN_H}>
            <Screen6_Welcome />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
