<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>B2B Ecommerce Flow — Forge & Co.</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; font-family: 'Geist', sans-serif; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens/shared.jsx"></script>
<script type="text/babel" src="screens/Homepage.jsx"></script>
<script type="text/babel" src="screens/CategoryPage.jsx"></script>
<script type="text/babel" src="screens/BrandPage.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas
        title="Forge & Co. — B2B Wholesale"
        subtitle="Three-screen flow · Homepage → Category → Brand · 1440 wide"
      >
        <DCSection id="flow" title="Buyer flow">
          <DCArtboard id="home" label="01 · Homepage" width={1440} height={3520}>
            <Homepage />
          </DCArtboard>
          <DCArtboard id="cat" label="02 · Category — Apothecary" width={1440} height={1680}>
            <CategoryPage />
          </DCArtboard>
          <DCArtboard id="brand" label="03 · Brand — Marlow & Sons" width={1440} height={1840}>
            <BrandPage />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
